services:
  hammerhead-fit-downloader:
    # Pulls the pre-built image from goatie999's Docker Hub account (see
    # "About docker-compose.yml" in README.md). Nothing is built on this
    # host — Docker Compose pulls the image automatically.
    image: goatie999/hammerhead-fit-downloader:latest
    container_name: hammerhead-fit-downloader
    restart: unless-stopped
    env_file: .env
    volumes:
      # Watch folder stays at the root, next to (not inside) hammerhead/.
      - ./watch:/data/dreeve/watch
      # Sync cursor: which activities are already downloaded.
      - ./hammerhead/state:/data/hammerhead/state
      # OAuth tokens. Kept in its own folder so you can back it up or lock
      # down its permissions independently of state/.
      - ./hammerhead/tokens:/data/hammerhead/tokens
