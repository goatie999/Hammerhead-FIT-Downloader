services:
  hammerhead-fit-downloader:
    # Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub namespace
    # (see "Building and publishing the image" in README.md). Docker Compose
    # pulls this automatically; nothing is built on the host.
    image: goatie999/hammerhead-fit-downloader:latest
    container_name: hammerhead-fit-downloader
    restart: unless-stopped
    env_file: .env
    volumes:
      # Fit files are downloaded into the common 'Watch' for Dreeve to ingest
      - ./watch:/data/dreeve/watch
      - ./hammerhead/state:/data/hammerhead/state
      - ./hammerhead/tokens:/data/hammerhead/tokens