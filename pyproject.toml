[project]
name = "hammerhead-fit-downloader"
version = "1.1.0"
description = "Pulls activity FIT files out of Hammerhead and drops them into Dreeve's watch folder. Inspired by dreeve-garmin-connector."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
hammerhead-fit-downloader = "hammerhead_fit_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammerhead_fit_downloader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]
